name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  issues: read
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Determine version bump
        id: release
        run: node .github/scripts/determine-release-bump.mjs

      - name: Skip release
        if: steps.release.outputs.release_needed != 'true'
        env:
          RANGE: ${{ steps.release.outputs.range }}
        run: echo "No release-worthy semver commits found in ${RANGE}."

      - name: Enable pnpm
        if: steps.release.outputs.release_needed == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.release.outputs.release_needed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Configure release commit author
        if: steps.release.outputs.release_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump package version
        id: version
        if: steps.release.outputs.release_needed == 'true'
        shell: bash
        env:
          BUMP: ${{ steps.release.outputs.bump }}
        run: |
          set -euo pipefail

          npm version "$BUMP" --no-git-tag-version

          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          tag="v${version}"

          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if [[ "$version" == *-* ]]; then
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.release.outputs.release_needed == 'true'
        run: pnpm run build

      - name: Validate package contents
        if: steps.release.outputs.release_needed == 'true'
        run: npm pack --dry-run --ignore-scripts --json

      - name: Commit and tag release
        if: steps.release.outputs.release_needed == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git add package.json
          git commit -m "chore(release): ${TAG}"
          git tag "${TAG}"

      - name: Push release commit and tag
        if: steps.release.outputs.release_needed == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git push origin HEAD:main
          git push origin "${TAG}"

      - name: Publish to npm
        if: steps.release.outputs.release_needed == 'true'
        run: npm publish --access public --tag "${{ steps.version.outputs.npm_tag }}"

      - name: Create GitHub release
        if: steps.release.outputs.release_needed == 'true'
        uses: actions/github-script@v9
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.TAG;
            const prerelease = process.env.PRERELEASE === "true";

            const { data: notes } = await github.rest.repos.generateReleaseNotes({
              owner,
              repo,
              tag_name: tag,
              target_commitish: tag,
            });

            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: notes.name || tag,
              body: notes.body,
              prerelease,
              generate_release_notes: false,
            });
