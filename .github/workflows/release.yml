name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish npm package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      issues: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Determine version bump
        id: release
        run: node .github/scripts/determine-release-bump.mjs

      - name: Skip release
        if: steps.release.outputs.release_needed != 'true'
        env:
          RANGE: ${{ steps.release.outputs.range }}
        run: echo "No release-worthy semver commits found in ${RANGE}."

      - name: Set up pnpm
        if: steps.release.outputs.release_needed == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Install dependencies
        if: steps.release.outputs.release_needed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Configure release commit author
        if: steps.release.outputs.release_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump package version
        id: version
        if: steps.release.outputs.release_needed == 'true'
        shell: bash
        env:
          BUMP: ${{ steps.release.outputs.bump }}
        run: |
          set -euo pipefail

          npm version "$BUMP" --no-git-tag-version

          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          tag="v${version}"

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Build package
        if: steps.release.outputs.release_needed == 'true'
        run: pnpm run build

      - name: Validate package contents
        if: steps.release.outputs.release_needed == 'true'
        run: pnpm run test:package

      - name: Commit and tag release
        if: steps.release.outputs.release_needed == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git add package.json
          git commit -m "chore(release): ${TAG}"
          git tag "${TAG}"

      - name: Verify main has not advanced
        if: steps.release.outputs.release_needed == 'true'
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"

      - name: Publish verified package or resume matching publication
        if: steps.release.outputs.release_needed == 'true'
        run: node .github/scripts/publish-package.mjs

      - name: Push release commit and tag atomically
        if: steps.release.outputs.release_needed == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git push --atomic origin HEAD:main "refs/tags/${TAG}"

      - name: Create GitHub release
        if: steps.version.outputs.tag != '' || steps.release.outputs.latest_tag != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TAG: ${{ steps.version.outputs.tag || steps.release.outputs.latest_tag }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.TAG;
            const prerelease = tag.includes("-");

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            // A rerun after tagging can recover release-note creation. Confirm
            // the tagged version exists on npm before announcing it.
            const { execFileSync } = require("node:child_process");
            const { name } = require(`${process.env.GITHUB_WORKSPACE}/package.json`);
            execFileSync("npm", ["view", `${name}@${tag.slice(1)}`, "version", "--json"], { stdio: "pipe" });

            const { data: notes } = await github.rest.repos.generateReleaseNotes({
              owner,
              repo,
              tag_name: tag,
              target_commitish: tag,
            });

            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: notes.name || tag,
              body: notes.body,
              prerelease,
              generate_release_notes: false,
            });
